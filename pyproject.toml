[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visibility"
version = "0.1.0"
description = "Hermes — a personal CLI agent that ingests GitHub, Notion, and Obsidian signals into a local Postgres warehouse and drafts a morning briefing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt[postgres,pandas,parquet]>=1.26.0",
    "psycopg[binary]>=3.2.0",
    "fastmcp>=3.3.1",
    "ipykernel>=7.2.0",
    "notion-client>=3.1.0",
    "ollama>=0.6.2",
    "pandas>=3.0.3",
    "prefect>=3.7.1",
    "prompt-toolkit>=3.0.52",
    "pyarrow>=24.0.0",
    "pydantic-ai>=1.97.0",
    "pyfiglet>=1.0.4",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "resend>=2.30.1",
    "rich>=15.0.0",
    "ruff>=0.15.13",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.5.1",
    "typer>=0.25.1",
    "edgartools>=5.35.0",
    "ddgs>=9.14.4",
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "guardrails-ai>=0.1.8",
    "alt-profanity-check>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hermes = "hermes.cli.chat:app"
